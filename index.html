    <!-- SCRIPT TO FORCE DESKTOP VIEWPORT ON MOBILE -->
    <script>
        (function() {
            // Check if the user is on a mobile device
            var isMobile = /iPhone|iPad|iPod|Android|BlackBerry|Opera Mini|IEMobile/i.test(navigator.userAgent);
            
            if (isMobile) {
                // Force the viewport to 1000px width and scale to fit
                var metaViewport = document.querySelector('meta[name="viewport"]');
                if (metaViewport) {
                    metaViewport.setAttribute('content', 'width=1000, initial-scale=0.3, maximum-scale=3.0, user-scalable=yes');
                } else {
                    var meta = document.createElement('meta');
                    meta.name = 'viewport';
                    meta.content = 'width=1000, initial-scale=0.3, maximum-scale=3.0, user-scalable=yes';
                    document.head.appendChild(meta);
                }

                // Prevent mobile browsers from overriding the width
                document.documentElement.style.width = '1000px';
                document.body.style.width = '1000px';
                
                // Wait for DOM to load then set the body min-width
                document.addEventListener('DOMContentLoaded', function() {
                    document.body.style.minWidth = '1000px';
                    document.documentElement.style.minWidth = '1000px';
                });
            }
        })();
